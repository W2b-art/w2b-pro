<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>W2b pro — local admin</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  :root { --bg:#0c1016; --panel:#161c26; --panel2:#1c2330; --line:#232b38; --line2:#2a3344; --text:#e8ecf2; --dim:#8d97a8; --accent:#c8933f; --accent-dim:#9c7230; --danger:#c85a3f; }
  * { box-sizing: border-box; }
  body { font: 14px/1.4 system-ui, sans-serif; background: var(--bg); color: var(--text); margin: 0; }
  header { padding: 10px 20px; background: var(--panel); border-bottom: 1px solid var(--line); position: sticky; top: 0; z-index: 20; display: flex; align-items: center; gap: 14px; flex-wrap: wrap; }
  header h1 { font-size: 15px; margin: 0; font-weight: 700; letter-spacing: .01em; }
  header .note { color: var(--dim); font-size: 11px; }
  nav.tabs { display: flex; gap: 8px; margin-left: 10px; }
  nav.tabs button { background: var(--panel2); color: #b7c0cd; border: 1px solid var(--line2); border-radius: 7px; padding: 6px 14px; cursor: pointer; font-size: 12px; }
  nav.tabs button.on { background: var(--accent); color: #171206; border-color: var(--accent); font-weight: 600; }
  nav.subtabs { display: flex; gap: 6px; margin-bottom: 16px; }
  nav.subtabs button { background: var(--panel); color: var(--dim); border: 1px solid var(--line); border-radius: 6px; padding: 6px 12px; cursor: pointer; font-size: 12px; }
  nav.subtabs button.on { background: var(--panel2); color: var(--text); border-color: var(--accent-dim); }
  .pub-btn { background: var(--panel2); color: #ccc; border: 1px solid var(--line2); border-radius: 7px; padding: 7px 14px; cursor: pointer; font-size: 12px; display: flex; align-items: center; gap: 7px; margin-left: auto; }
  .pub-btn.has-pending { background: #3a2a10; border-color: var(--accent-dim); color: #f0cf8a; }
  .pub-badge { background: var(--accent); color: #171206; border-radius: 10px; padding: 0 7px; font-size: 11px; font-weight: 700; min-width: 18px; text-align: center; }
  main { padding: 18px 22px 60px; max-width: 1180px; margin: 0 auto; }
  .tabpanel { display: none; }
  .tabpanel.on { display: block; }
  .tab-toolbar { display: flex; align-items: center; justify-content: space-between; margin-bottom: 14px; }
  .tab-toolbar .hint { color: var(--dim); font-size: 11px; }
  .section { margin-bottom: 10px; border: 1px solid var(--line); border-radius: 9px; overflow: hidden; background: var(--panel); }
  .section-head { padding: 10px 14px; background: var(--panel2); display: flex; align-items: center; gap: 10px; cursor: pointer; }
  .section-head:hover { background: #222a38; }
  .section-head b { font-size: 13px; }
  .section-head .count { color: var(--dim); font-size: 11px; }
  .section.collapsed .section-body { display: none; }
  .section-head::before { content: '\25B8'; color: #6b7585; font-size: 10px; transition: transform .15s; }
  .section:not(.collapsed) .section-head::before { transform: rotate(90deg); }
  .section-body { padding: 12px; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 12px; }
  .card { background: var(--panel2); border: 1px solid var(--line2); border-radius: 8px; overflow: hidden; display: flex; flex-direction: column; }
  .card img { width: 100%; aspect-ratio: 4/3; object-fit: cover; display: block; background: #0c1016; }
  .card .body { padding: 8px 9px; display: flex; flex-direction: column; gap: 6px; }
  .card .alt { font-size: 11px; color: #c3cad6; min-height: 28px; }
  .card .alt.empty { color: #5a6474; font-style: italic; }
  .card .fname { font-size: 10px; color: #6b7585; }
  .card .actions { display: flex; gap: 5px; flex-wrap: wrap; }
  button.ghost { background: #0c1016; color: #c3cad6; border: 1px solid var(--line2); border-radius: 5px; padding: 4px 8px; font-size: 11px; cursor: pointer; }
  button.ghost:hover { border-color: var(--accent-dim); }
  button.ghost.danger { border-color: #5e3328; color: #e0a08f; }
  .txt-row { display: flex; align-items: flex-start; gap: 10px; padding: 9px 12px; border-bottom: 1px solid var(--line); }
  .txt-row:last-child { border-bottom: none; }
  .txt-row .txt-key { width: 140px; flex: 0 0 140px; font-size: 11px; color: var(--accent); word-break: break-all; padding-top: 3px; }
  .txt-row .txt-vals { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 3px; }
  .txt-row .txt-val { font-size: 12px; color: #ccd3dd; white-space: pre-wrap; }
  .txt-row .txt-val b { color: #6b7585; font-weight: 600; font-size: 10px; text-transform: uppercase; margin-right: 6px; }
  .txt-row .txt-actions { flex: 0 0 auto; display: flex; gap: 6px; }
  .txt-missing { color: #4e5666; font-style: italic; }
  form.panel { background: var(--panel); border: 1px solid var(--line2); border-radius: 9px; padding: 16px; margin-bottom: 20px; max-width: 640px; }
  form.panel h3 { margin: 0 0 4px; font-size: 15px; }
  form.panel label { display: block; margin-top: 10px; font-size: 11px; color: var(--dim); }
  form.panel input, form.panel select, form.panel textarea { width: 100%; padding: 7px; background: var(--bg); border: 1px solid var(--line2); color: var(--text); border-radius: 5px; font-size: 13px; }
  form.panel .hint { font-size: 11px; color: var(--dim); margin-top: 4px; }
  form.panel button.submit { margin-top: 14px; padding: 9px 18px; background: var(--accent); border: 1px solid var(--accent); color: #171206; border-radius: 6px; cursor: pointer; font-size: 13px; font-weight: 600; }
  .toast { position: fixed; bottom: 18px; left: 50%; transform: translateX(-50%); background: #1c2330; border: 1px solid var(--line2); color: var(--text); padding: 10px 16px; border-radius: 7px; font-size: 13px; z-index: 80; }
  .toast.err { border-color: #5e3328; color: #e0a08f; }
</style>
</head>
<body>
<header>
  <h1>W2b pro — local admin</h1>
  <span class="note">local only · never deployed</span>
  <nav class="tabs">
    <button data-tab="galleries" class="on">Galleries</button>
    <button data-tab="upload">Upload</button>
    <button data-tab="texts">Texts</button>
  </nav>
  <button class="pub-btn" id="pub-btn" type="button" title="Review and push pending changes">
    <span id="pub-label">Publish</span><span class="pub-badge" id="pub-badge" style="display:none">0</span>
  </button>
</header>
<main id="main">Loading…</main>
<script>
let STATE = null;
let OPEN_SECTIONS = new Set();

async function api(path, opts) {
  const r = await fetch(path, opts);
  const j = await r.json();
  if (!r.ok || j.ok === false) throw new Error(j.error || 'request failed');
  return j;
}

function toast(msg, isErr) {
  document.querySelectorAll('.toast').forEach((n) => n.remove());
  const t = document.createElement('div');
  t.className = 'toast' + (isErr ? ' err' : '');
  t.textContent = msg;
  document.body.appendChild(t);
  setTimeout(() => t.remove(), isErr ? 5000 : 2200);
}

async function doAction(action, successMsg, silent) {
  try {
    const r = await api('/api/action', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(action) });
    STATE = r.state;
    renderAll();
    if (!silent) toast(successMsg || r.message || 'done');
    refreshPublishStatus();
    return r;
  } catch (e) {
    toast(e.message, true);
    throw e;
  }
}

let PENDING_FILES = [];
async function refreshPublishStatus() {
  try {
    const r = await api('/api/git/status');
    PENDING_FILES = r.files;
    const btn = document.getElementById('pub-btn');
    const badge = document.getElementById('pub-badge');
    if (PENDING_FILES.length) { btn.classList.add('has-pending'); badge.style.display = ''; badge.textContent = PENDING_FILES.length; }
    else { btn.classList.remove('has-pending'); badge.style.display = 'none'; }
  } catch (e) { /* non-fatal */ }
}

function openPublishModal() {
  document.querySelectorAll('.modal-backdrop').forEach((n) => n.remove());
  const backdrop = document.createElement('div');
  backdrop.className = 'modal-backdrop';
  backdrop.style = 'position:fixed;inset:0;background:rgba(0,0,0,.6);display:flex;align-items:center;justify-content:center;z-index:60;';
  const form = document.createElement('form');
  form.className = 'panel';
  form.style = 'margin:0;max-width:560px;max-height:90vh;overflow:auto;';
  form.innerHTML = '<h3>Publish ' + PENDING_FILES.length + ' pending file(s)</h3>' +
    '<div class="hint">Commits and pushes just these files (images/, gallery-data.js, site.js, and the page files), nothing else in the repo.</div>' +
    '<ul style="font-size:11px;color:#8d97a8;max-height:160px;overflow:auto;padding-left:18px;">' + PENDING_FILES.map((f) => '<li>' + f.status + ' ' + f.file + '</li>').join('') + '</ul>' +
    '<label>Commit message (optional)</label><input id="pub-msg" placeholder="Admin: updated...">' +
    '<div style="display:flex;gap:10px;margin-top:14px;">' +
    '<button type="button" class="submit" id="pub-submit">Commit &amp; push</button>' +
    '<button type="button" id="pub-cancel" style="padding:9px 18px;background:#1c2330;border:1px solid #2a3344;color:#eee;border-radius:6px;cursor:pointer;">Cancel</button>' +
    '</div>';
  backdrop.appendChild(form);
  document.body.appendChild(backdrop);
  const close = () => backdrop.remove();
  backdrop.onclick = (e) => { if (e.target === backdrop) close(); };
  document.getElementById('pub-cancel').onclick = close;
  document.getElementById('pub-submit').onclick = async () => {
    try {
      const r = await api('/api/git/publish', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ message: document.getElementById('pub-msg').value }) });
      toast('Published ' + r.committed + ' file(s)');
      close();
      refreshPublishStatus();
    } catch (e) { toast(e.message, true); }
  };
}
document.getElementById('pub-btn').onclick = () => { if (PENDING_FILES.length) openPublishModal(); else toast('nothing pending'); };

document.querySelectorAll('nav.tabs button').forEach((btn) => {
  btn.onclick = () => {
    document.querySelectorAll('nav.tabs button').forEach((b) => b.classList.remove('on'));
    document.querySelectorAll('section.tabpanel').forEach((p) => p.classList.remove('on'));
    btn.classList.add('on');
    document.getElementById('panel-' + btn.dataset.tab).classList.add('on');
  };
});

document.addEventListener('keydown', (ev) => {
  if (ev.key !== 'Escape') return;
  const backdrop = document.querySelector('.modal-backdrop');
  if (backdrop) backdrop.remove();
});

// ---------------------------------------------------------------------
// Shared modal helpers
// ---------------------------------------------------------------------
function openTextFieldModal(opts) {
  // opts: { title, hint, label, initial, onSave(value, close), onDelete }
  document.querySelectorAll('.modal-backdrop').forEach((n) => n.remove());
  const backdrop = document.createElement('div');
  backdrop.className = 'modal-backdrop';
  backdrop.style = 'position:fixed;inset:0;background:rgba(0,0,0,.6);display:flex;align-items:center;justify-content:center;z-index:60;';
  const form = document.createElement('form');
  form.className = 'panel';
  form.style = 'margin:0;max-width:560px;max-height:90vh;overflow:auto;';
  form.innerHTML = '<h3>' + opts.title + '</h3>' +
    (opts.hint ? '<div class="hint">' + opts.hint + '</div>' : '') +
    '<label>' + (opts.label || 'Text') + '</label><textarea id="tf-val" rows="4" style="width:100%;resize:vertical;"></textarea>' +
    '<div style="display:flex;gap:10px;margin-top:14px;">' +
    '<button type="button" class="submit" id="tf-submit">Save</button>' +
    (opts.onDelete ? '<button type="button" id="tf-delete" style="padding:9px 18px;background:#1c2330;border:1px solid #5e3328;color:#e0a08f;border-radius:6px;cursor:pointer;">Delete</button>' : '') +
    '<button type="button" id="tf-cancel" style="padding:9px 18px;background:#1c2330;border:1px solid #2a3344;color:#eee;border-radius:6px;cursor:pointer;">Cancel</button>' +
    '</div>';
  backdrop.appendChild(form);
  document.body.appendChild(backdrop);
  document.getElementById('tf-val').value = opts.initial || '';
  const close = () => backdrop.remove();
  backdrop.onclick = (e) => { if (e.target === backdrop) close(); };
  document.getElementById('tf-cancel').onclick = close;
  if (opts.onDelete) document.getElementById('tf-delete').onclick = () => opts.onDelete(close);
  document.getElementById('tf-submit').onclick = () => opts.onSave(document.getElementById('tf-val').value.trim(), close);
}

function openPageTextModal(opts) {
  // opts: { title, hint, langs, initial:{lang:text}, onSave(valuesByLang, close), onDelete }
  document.querySelectorAll('.modal-backdrop').forEach((n) => n.remove());
  const backdrop = document.createElement('div');
  backdrop.className = 'modal-backdrop';
  backdrop.style = 'position:fixed;inset:0;background:rgba(0,0,0,.6);display:flex;align-items:center;justify-content:center;z-index:60;';
  const form = document.createElement('form');
  form.className = 'panel';
  form.style = 'margin:0;max-width:640px;max-height:90vh;overflow:auto;';
  const initial = opts.initial || {};
  const ids = opts.langs.map((l) => 'ptm-' + l);
  form.innerHTML = '<h3>' + opts.title + '</h3>' +
    (opts.hint ? '<div class="hint">' + opts.hint + '</div>' : '') +
    opts.langs.map((l, i) => '<label>' + l.toUpperCase() + '</label><textarea id="' + ids[i] + '" rows="3" style="width:100%;resize:vertical;"></textarea>').join('') +
    '<div style="display:flex;gap:10px;margin-top:14px;">' +
    '<button type="button" class="submit" id="ptm-submit">Save</button>' +
    (opts.onDelete ? '<button type="button" id="ptm-delete" style="padding:9px 18px;background:#1c2330;border:1px solid #5e3328;color:#e0a08f;border-radius:6px;cursor:pointer;">Delete</button>' : '') +
    '<button type="button" id="ptm-cancel" style="padding:9px 18px;background:#1c2330;border:1px solid #2a3344;color:#eee;border-radius:6px;cursor:pointer;">Cancel</button>' +
    '</div>';
  backdrop.appendChild(form);
  document.body.appendChild(backdrop);
  opts.langs.forEach((l, i) => { document.getElementById(ids[i]).value = initial[l] || ''; });
  const close = () => backdrop.remove();
  backdrop.onclick = (e) => { if (e.target === backdrop) close(); };
  document.getElementById('ptm-cancel').onclick = close;
  if (opts.onDelete) document.getElementById('ptm-delete').onclick = () => opts.onDelete(close);
  document.getElementById('ptm-submit').onclick = () => {
    const out = {}; let anyBlank = false;
    opts.langs.forEach((l, i) => { out[l] = document.getElementById(ids[i]).value.trim(); if (!out[l]) anyBlank = true; });
    if (anyBlank) { toast('every language field is required', true); return; }
    opts.onSave(out, close);
  };
}

function openAddKeyPrompt(onAdd) {
  const key = (prompt('New key name (letters/numbers/underscore)') || '').trim();
  if (!key) return;
  if (!/^[A-Za-z_$][\w$]*$/.test(key)) { toast('key must start with a letter/underscore, letters/numbers/underscore only', true); return; }
  onAdd(key);
}

// ---------------------------------------------------------------------
// Galleries tab
// ---------------------------------------------------------------------
function card(gallery, im) {
  const el = document.createElement('div'); el.className = 'card';
  const img = document.createElement('img'); img.loading = 'lazy'; img.src = '/img/' + im.src.replace(/^images\//, '');
  el.appendChild(img);
  const body = document.createElement('div'); body.className = 'body';
  const fname = document.createElement('div'); fname.className = 'fname'; fname.textContent = '#' + im.idx + ' · ' + im.full.split('/').pop();
  body.appendChild(fname);
  const alt = document.createElement('div'); alt.className = 'alt' + (im.alt ? '' : ' empty'); alt.textContent = im.alt || 'no caption';
  body.appendChild(alt);
  const actions = document.createElement('div'); actions.className = 'actions';
  const editBtn = document.createElement('button'); editBtn.type = 'button'; editBtn.className = 'ghost'; editBtn.textContent = 'Edit caption';
  editBtn.onclick = () => openTextFieldModal({
    title: 'Caption — ' + gallery.id + ' #' + im.idx,
    label: 'Caption (single language, as this site stores it)',
    initial: im.alt,
    onSave: (val, close) => doAction({ type: 'set-photo-alt', category: gallery.id, idx: im.idx, alt: val }, 'caption saved').then(close).catch(() => {})
  });
  actions.appendChild(editBtn);
  const posInput = document.createElement('input'); posInput.type = 'number'; posInput.value = im.idx; posInput.style = 'width:48px;padding:4px;font-size:11px;background:#0c1016;border:1px solid #2a3344;color:#eee;border-radius:5px;';
  const moveBtn = document.createElement('button'); moveBtn.type = 'button'; moveBtn.className = 'ghost'; moveBtn.textContent = 'Move';
  moveBtn.onclick = () => {
    const newIdx = parseInt(posInput.value, 10);
    if (Number.isNaN(newIdx)) return;
    doAction({ type: 'reorder-photo', category: gallery.id, idx: im.idx, newIdx }, 'reordered');
  };
  actions.appendChild(posInput);
  actions.appendChild(moveBtn);
  const delBtn = document.createElement('button'); delBtn.type = 'button'; delBtn.className = 'ghost danger'; delBtn.textContent = 'Delete';
  delBtn.onclick = () => {
    if (!confirm('Remove this photo from ' + gallery.id + '? The files move to images/_archive/' + gallery.id + '/, nothing is erased.')) return;
    doAction({ type: 'delete-photo', category: gallery.id, idx: im.idx }, 'moved to archive');
  };
  actions.appendChild(delBtn);
  body.appendChild(actions);
  el.appendChild(body);
  return el;
}

function renderGalleries() {
  const main = document.getElementById('panel-galleries');
  main.innerHTML = '';
  const toolbar = document.createElement('div'); toolbar.className = 'tab-toolbar';
  toolbar.innerHTML = '<span class="hint">' + STATE.galleries.length + ' categories — this is the live homepage/category-page selection, not the whole raw photo folder.</span>';
  main.appendChild(toolbar);

  STATE.galleries.forEach((g) => {
    const sectionId = 'gal-' + g.id;
    const section = document.createElement('div'); section.className = 'section' + (OPEN_SECTIONS.has(sectionId) ? '' : ' collapsed');
    const head = document.createElement('div'); head.className = 'section-head';
    const liveBadge = g.live ? ' <span style="color:#6c8;font-size:10px;letter-spacing:.06em;">LIVE</span>' : ' <span style="color:#998;font-size:10px;letter-spacing:.06em;" title="No page currently shows this category">not shown on site</span>';
    head.innerHTML = '<b>' + g.id + '</b>' + liveBadge + '<span class="count">' + g.images.length + ' photo(s)</span>';
    head.onclick = () => { section.classList.toggle('collapsed'); if (section.classList.contains('collapsed')) OPEN_SECTIONS.delete(sectionId); else OPEN_SECTIONS.add(sectionId); };
    section.appendChild(head);
    const body = document.createElement('div'); body.className = 'section-body';
    const grid = document.createElement('div'); grid.className = 'grid';
    g.images.forEach((im) => grid.appendChild(card(g, im)));
    body.appendChild(grid);
    section.appendChild(body);
    main.appendChild(section);
  });
}

// ---------------------------------------------------------------------
// Upload tab
// ---------------------------------------------------------------------
function renderUpload() {
  const main = document.getElementById('panel-upload');
  main.innerHTML = '';
  const form = document.createElement('form'); form.className = 'panel';
  form.innerHTML = '<h3>Upload a new photo</h3>' +
    '<div class="hint">Resizes to the site’s own two sizes (full ≤ 2000px, -m thumbnail 1100px wide) via the same sharp pipeline the art site uses, and appends it to the end of the chosen category.</div>' +
    '<label>Category</label><select id="up-cat">' + STATE.galleries.map((g) => '<option value="' + g.id + '">' + g.id + '</option>').join('') + '</select>' +
    '<label>File</label><input type="file" id="up-file" accept="image/jpeg">' +
    '<label>Caption</label><textarea id="up-alt" rows="2" placeholder="single language, as this site stores it"></textarea>' +
    '<button type="button" class="submit" id="up-submit">Upload</button>';
  main.appendChild(form);
  document.getElementById('up-submit').onclick = async () => {
    const fileInput = document.getElementById('up-file');
    const file = fileInput.files[0];
    if (!file) { toast('pick a file first', true); return; }
    const category = document.getElementById('up-cat').value;
    const alt = document.getElementById('up-alt').value.trim();
    const reader = new FileReader();
    reader.onload = async () => {
      const b64 = reader.result.split(',')[1];
      try {
        await doAction({ type: 'upload', category, dataBase64: b64, alt }, 'uploaded');
        fileInput.value = ''; document.getElementById('up-alt').value = '';
      } catch (e) { /* toasted already */ }
    };
    reader.readAsDataURL(file);
  };
}

// ---------------------------------------------------------------------
// Texts tab
// ---------------------------------------------------------------------
function renderTexts() {
  const main = document.getElementById('panel-texts');
  main.innerHTML = '';
  const toolbar = document.createElement('div'); toolbar.className = 'tab-toolbar';
  toolbar.innerHTML = '<span class="hint">Every hand-authored trilingual string table this site actually loads — js/lang.js and js/services-i18n.js exist on disk but aren’t loaded by any page, so they’re not here.</span>';
  main.appendChild(toolbar);

  STATE.texts.pages.forEach((page) => {
    const sectionId = 'txt-' + page.id;
    const section = document.createElement('div'); section.className = 'section' + (OPEN_SECTIONS.has(sectionId) ? '' : ' collapsed');
    const head = document.createElement('div'); head.className = 'section-head';
    head.innerHTML = '<b>' + page.label + '</b><span class="count">' + page.rel + (page.error ? ' — <span style="color:#e0a08f">' + page.error + '</span>' : '') + '</span>';
    head.onclick = () => { section.classList.toggle('collapsed'); if (section.classList.contains('collapsed')) OPEN_SECTIONS.delete(sectionId); else OPEN_SECTIONS.add(sectionId); };
    if (!page.error) {
      const addBtn = document.createElement('button'); addBtn.type = 'button'; addBtn.className = 'ghost'; addBtn.style.marginLeft = 'auto'; addBtn.textContent = 'Add new key';
      addBtn.onclick = (ev) => {
        ev.stopPropagation();
        openAddKeyPrompt((key) => {
          if (page.data[page.langs[0]] && page.data[page.langs[0]][key] != null) { toast('"' + key + '" already exists on this page', true); return; }
          openPageTextModal({
            title: 'New key — ' + page.label + ' — ' + key,
            langs: page.langs,
            initial: {},
            onSave: (val, close) => doAction({ type: 'set-page-text', pageId: page.id, key, value: val }, key + ' added').then(close).catch(() => {})
          });
        });
      };
      head.appendChild(addBtn);
    }
    section.appendChild(head);

    if (!page.error) {
      const body = document.createElement('div'); body.className = 'section-body'; body.style.padding = '0';
      const keys = Object.keys(page.data[page.langs[0]] || {}).sort();
      keys.forEach((key) => {
        const row = document.createElement('div'); row.className = 'txt-row';
        row.innerHTML = '<div class="txt-key">' + key + '</div>' +
          '<div class="txt-vals">' + page.langs.map((l) => '<div class="txt-val"><b>' + l.toUpperCase() + '</b>' + ((page.data[l] && page.data[l][key]) || '<span class="txt-missing">—</span>') + '</div>').join('') + '</div>';
        const actions = document.createElement('div'); actions.className = 'txt-actions';
        const editBtn = document.createElement('button'); editBtn.type = 'button'; editBtn.className = 'ghost'; editBtn.textContent = 'Edit';
        editBtn.onclick = () => {
          const initial = {}; page.langs.forEach((l) => { initial[l] = (page.data[l] && page.data[l][key]) || ''; });
          openPageTextModal({
            title: 'Edit — ' + page.label + ' — ' + key,
            langs: page.langs,
            initial,
            onSave: (val, close) => doAction({ type: 'set-page-text', pageId: page.id, key, value: val }, key + ' saved').then(close).catch(() => {}),
            onDelete: (close) => {
              if (!confirm('Delete "' + key + '" from ' + page.label + '? The element showing it will just go blank.')) return;
              doAction({ type: 'set-page-text', pageId: page.id, key, value: null }, key + ' deleted').then(close).catch(() => {});
            }
          });
        };
        actions.appendChild(editBtn);
        row.appendChild(actions);
        body.appendChild(row);
      });
      section.appendChild(body);
    }
    main.appendChild(section);
  });
}

function renderAll() {
  renderGalleries();
  renderUpload();
  renderTexts();
}

(async function init() {
  try {
    STATE = await api('/api/state');
    document.getElementById('main').innerHTML =
      '<section class="tabpanel on" id="panel-galleries"></section>' +
      '<section class="tabpanel" id="panel-upload"></section>' +
      '<section class="tabpanel" id="panel-texts"></section>';
    renderAll();
    refreshPublishStatus();
  } catch (e) {
    document.getElementById('main').textContent = 'Failed to load: ' + e.message;
  }
})();
</script>
</body>
</html>
