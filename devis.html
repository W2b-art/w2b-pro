      {id:'looks',label:{es:"Cambios de look",en:"Looks",fr:"Tenues"},opts:[

  /* ---- digital / film ----
     Film prices are COP amounts, added on top of the session fee and never
     rounded. Each service's `film` key holds either a fixed table
     (photos + r = [35mm rolls, 120 rolls] per format, for individuals) or
     `vol`: edited photos per volume answer, for business services. */
  const ROLL=65000, LAB=40000, RUSH=15000;
  const MEDIUM={id:'medium',label:{es:"¿Digital o película?",en:"Digital or film?",fr:"Numérique ou argentique ?"},opts:[
    {l:{es:"Digital",en:"Digital",fr:"Numérique"},d:[0,0]},
    {l:{es:"Análoga (película)",en:"Film",fr:"Argentique"},d:[0,0]}]};
  const FORMAT={id:'format',label:{es:"Formato de película",en:"Film format",fr:"Format de pellicule"},opts:[
    {l:{es:"35 mm",en:"35mm",fr:"35 mm"},d:[0,0],hint:{
      es:"36 disparos por rollo. Más espontáneo y más económico, con un grano visible. Menos detalle en copias grandes.",
      en:"36 frames per roll. More spontaneous and more affordable, with visible grain. Less detail in large prints.",
      fr:"36 vues par rouleau. Plus spontané et plus accessible, avec un grain visible. Moins de détail en grand tirage."}},
    {l:{es:"Mezcla 35 mm + 120",en:"35mm + 120 mix",fr:"Mélange 35 mm + 120"},d:[0,0],hint:{
      es:"El 35 mm para los momentos en movimiento y el 120 para los retratos que quieras imprimir en grande.",

    {l:{es:"Todo en 120 (premium)",en:"All 120 (premium)",fr:"Tout en 120 (premium)"},d:[0,0],hint:{
      es:"Sesión premium, con un sobrecosto por el medio utilizado. Negativo en 6 × 6, unas 3,6 veces más grande: más detalle y mejores copias grandes. Solo 12 disparos por rollo y un ritmo más pausado.",
      en:"Premium session, with a surcharge for the medium. 6×6 negative, about 3.6 times larger: more detail and better large prints. Only 12 frames per roll and a slower pace.",
      fr:"Séance premium, avec un surcoût lié au support. Négatif 6 × 6, environ 3,6 fois plus grand : plus de détail et de meilleurs grands tirages. Seulement 12 vues par rouleau et un rythme plus posé."}}]};
  const LABQ={id:'lab',label:{es:"Plazo de laboratorio",en:"Lab turnaround",fr:"Délai du laboratoire"},opts:[

    return isFilm()?[MEDIUM,fq,...s.q,LABQ]:[MEDIUM,...s.q];

  const usable=o=>!(isFilm()&&o.digitalOnly);
  function filmInfo(){
    const f=curSvc().film,fm=sel.format||0;
    // business: the largest volume answer sets the photo count

    // same proportions per 10 photos as the couple session (50 photos: 5, 3+3, 12)
    const per=(x)=>Math.ceil(photos*x/50);
    // `table` overrides the proportional rule, one row per volume answer
    const [a,b]=f.table?f.table.r[sel[f.table.key]||0][fm]:f.vol?[[per(5),0],[per(3),per(3)],[0,per(12)]][fm]:f.r[fm];
    const n=a+b,parts=[];
    if(a)parts.push(a+' × 35 mm');if(b)parts.push(b+' × 120');
    return {photos,rolls:parts.join(' + '),cop:n*(ROLL+LAB+(sel.lab===1?RUSH:0))};

  /* progressive disclosure: each step stays out of the layout (hidden) until
     the previous choice is made, then fades/rises in via the site's .reveal
     pattern — "each choice opens another line" instead of showing the whole
     form at once. */
  function revealStep(id){
    const el=document.getElementById(id);if(!el||!el.hidden&&el.classList.contains('open'))return;
    el.hidden=false;el.classList.add('open','reveal');
    void el.offsetWidth; // force reflow so the next class change transitions
    requestAnimationFrame(()=>requestAnimationFrame(()=>el.classList.add('in')));
  }
  function hideStep(id){
    const el=document.getElementById(id);if(!el)return;
    el.hidden=true;el.classList.remove('open','reveal','in');
  }

  /* extraCop = exact film + lab cost, in pesos */
  function fmt(n,ratio,extraCop){
    const x=extraCop||0;
    if(cur==='COP'){const v=Math.round(n*(ratio||4000)/50000)*50000+x;return '$'+v.toLocaleString('es-CO');}
    const v=Math.round((n+x/(ratio||4000))/10)*10;
    if(lang==='en')return '€'+v.toLocaleString('en-US');
    if(lang==='fr')return v.toLocaleString('fr-FR')+' €';
    return v.toLocaleString('es-ES')+' €';
  }
  function svcList(){return SVC[aud];}
  function curSvc(){return svcList().find(s=>s.id===svcId)||svcList()[0];}

  function calc(){
    const s=curSvc(),base=(isFilm()&&s.film.fee)||s.base;let mn=base[0],mx=base[1];
    s.q.forEach(q=>{const v=sel[q.id];
      if(q.multi){(v||[]).filter(i=>usable(q.opts[i])).forEach(i=>{mn+=q.opts[i].d[0];mx+=q.opts[i].d[1];});}
      else if(v!=null){mn+=q.opts[v].d[0];mx+=q.opts[v].d[1];}
    });
    return [mn,mx];
  }

  function renderAud(){
    $('#aud').innerHTML=['entreprise','particular'].map(a=>
      `<button class="opt" data-a="${a}" aria-pressed="${a===aud}">${UI[lang].aud[a]}</button>`).join('');
    $$('#aud .opt').forEach(b=>b.onclick=()=>{aud=b.dataset.a;svcId=null;sel=defaults();renderAll();});
  }
  function renderSvc(){
    $('#svc').innerHTML=svcList().map(s=>
      `<button class="opt" data-s="${s.id}" aria-pressed="${s.id===svcId}">${t(s.name)}</button>`).join('');
    $$('#svc .opt').forEach(b=>b.onclick=()=>{svcId=b.dataset.s;sel=defaults();renderAll();});
  }
  function renderQ(){
    $('#qwrap').innerHTML=questions().map((q,qi)=>
      `<div class="d-lab"><span class="sn">${String(qi+3).padStart(2,'0')}</span><span>${t(q.label)}${q.multi?' <em style="color:var(--bone-faint);text-transform:none;letter-spacing:0;font-style:normal">('+({es:'opcional',en:'optional',fr:'optionnel'}[lang])+')</em>':''}</span></div>
       <div class="opts" data-q="${q.id}" data-multi="${!!q.multi}">${q.opts.map((o,oi)=>{
         if(!usable(o))return '';
         const on=q.multi?((sel[q.id]||[]).includes(oi)):(sel[q.id]===oi);
         return `<button class="opt" data-oi="${oi}" aria-pressed="${on}">${t(o.l)}</button>`;}).join('')}</div>${q.id==='format'?`<p class="d-hint">${t(q.opts[sel.format||0].hint)}</p>`:''}`
    ).join('');
    $$('#qwrap .opts').forEach(grp=>{
      const qid=grp.dataset.q, multi=grp.dataset.multi==='true';
      grp.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{
        const oi=+b.dataset.oi;
        if(multi){const arr=sel[qid]||[];const k=arr.indexOf(oi);if(k>=0)arr.splice(k,1);else arr.push(oi);sel[qid]=arr;}
        else sel[qid]=oi;
        renderQ();renderEst();
      });
    });
  }
  function range(mn,mx){
    const r=curSvc().copRatio,x=isFilm()?filmInfo().cop:0;
    return (mn===mx)?fmt(mn,r,x):`${fmt(mn,r,x)} – ${fmt(mx,r,x)}`;
  }
  function summary(){
    const s=curSvc(),[mn,mx]=calc(),U=UI[lang];
    const lines=[];
    lines.push(`- ${U.sum_type}: ${U.aud[aud]}`);
    lines.push(`- ${U.sum_svc}: ${t(s.name)}`);
    questions().forEach(q=>{const v=sel[q.id];
      if(q.multi){const on=(v||[]).filter(i=>usable(q.opts[i]));if(on.length)lines.push(`- ${t(q.label)}: ${on.map(i=>t(q.opts[i].l)).join(', ')}`);}
      else if(v!=null)lines.push(`- ${t(q.label)}: ${t(q.opts[v].l)}`);
    });
    if(isFilm()){const f=filmInfo();lines.push(`- ${U.sum_rolls}: ${f.rolls} (${f.photos} ${U.photos})`);}
    lines.push(`- ${U.sum_est}: ${range(mn,mx)}`);
    return `${U.sum_intro}\n${lines.join('\n')}\n\n${U.sum_more}`;
  }
  function renderEst(){
    const [mn,mx]=calc(),U=UI[lang],r=curSvc().copRatio,x=isFilm()?filmInfo().cop:0;
    $('#est_k').textContent=U.est_k;
    $('#est_val').innerHTML=(mn===mx)?`<em>${fmt(mn,r,x)}</em>`:`<em>${fmt(mn,r,x)}</em> – <em>${fmt(mx,r,x)}</em>`;
    if(isFilm()){const f=filmInfo();
      $('#est_note').textContent=U.film_note.replace('{rolls}',f.rolls).replace('{photos}',f.photos)+' '+U.est_note;
    }else $('#est_note').textContent=U.est_note;
    const msg=summary();
    $('#d_sum').textContent=msg;
    $('#cta_wa').href=`https://wa.me/${WA}?text=${encodeURIComponent(msg)}`;
    const subj=(lang==='fr'?'Pré-devis':lang==='en'?'Pre-quote':'Pre-presupuesto')+' — '+t(curSvc().name);
    $('#cta_mail').href=`mailto:${MAIL}?bcc=${encodeURIComponent(BCC)}&subject=${encodeURIComponent(subj)}&body=${encodeURIComponent(msg)}`;
  }
  function applyStatic(){
    const U=UI[lang];
    $('#d_k').textContent=U.d_k;$('#d_h').textContent=U.d_h;$('#d_lede').textContent=U.d_lede;
    $('#l_aud').textContent=U.l_aud;$('#l_svc').textContent=U.l_svc;
    $('#cta_wa_t').textContent=U.cta_wa;$('#cta_mail_t').textContent=U.cta_mail;
    $('#lead_email_l').textContent=U.lead_email_l;
    document.documentElement.lang=lang;
    $$('.cur [data-cur]').forEach(b=>b.setAttribute('aria-pressed',b.dataset.cur===cur));
  }
  function renderAll(){
    applyStatic();renderAud();
    if(aud){renderSvc();revealStep('step-svc');}else hideStep('step-svc');
    if(svcId){renderQ();renderEst();revealStep('qwrap');revealStep('step-est');}
    else{hideStep('qwrap');hideStep('step-est');}
  }

  /* ---- Formspree capture: fires alongside the WhatsApp/email handoff so
     every pre-quote leaves a durable, searchable record, without blocking
     either fallback channel. Reuses the same Formspree endpoint already
     wired up on the art site (collaborate.html / shop.html). ---- */
  const FORMSPREE="https://formspree.io/f/mjgjdvlz";
  function sendLead(channel){
    const fd=new FormData();
    fd.append('_subject','Pre-presupuesto (pro) — '+t(curSvc().name));
    fd.append('email',$('#lead_email').value||'(no email given)');
    fd.append('channel',channel);
    fd.append('lang',lang);fd.append('currency',cur);
    fd.append('audience',UI[lang].aud[aud]);
    fd.append('service',t(curSvc().name));
    fd.append('summary',summary());
    fetch(FORMSPREE,{method:'POST',headers:{Accept:'application/json'},body:fd}).catch(function(){/* non-blocking: WA/email fallback still works */});
    const sent=$('#lead_sent');sent.hidden=false;sent.textContent=UI[lang].lead_sent;
  }
  $('#cta_wa').addEventListener('click',()=>sendLead('whatsapp'));
  $('#cta_mail').addEventListener('click',()=>sendLead('email'));

  // wire to the rail's language + currency switches (built by site.js)
  function wire(){
    document.querySelectorAll('[data-lang]').forEach(b=>b.addEventListener('click',()=>{
      lang=b.dataset.lang;if(!UI[lang])lang='es';renderAll();}));
    document.querySelectorAll('[data-cur]').forEach(b=>b.addEventListener('click',()=>{
      cur=b.dataset.cur;localStorage.setItem('w2b_currency',cur);renderAll();}));
  }
  // let site.js build the rail first
  setTimeout(function(){wire();renderAll();},0);
})();
</script>
<script src="js/admin-link.js" defer></script>
</body></html>
